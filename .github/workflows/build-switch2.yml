name: Build Switch 2 (.nro)

on:
  push:
    branches: [ main, master, 'feature/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, 'feature/**' ]
  workflow_dispatch:

jobs:
  build-switch2:
    name: Switch 2 (Ounce / libounce + OunceVK)
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:20260219
    defaults:
      run:
        shell: bash
    env:
      OUNCE_DEVKIT_COMMIT: "0f38ba80d7ee768c5749278f127749d14ece2036"
      OUNCE_DEVKIT_TAG: "20261115b"
    steps:
      - name: Run unit tests for Switch 2 verifier
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-pil zip git ca-certificates curl xz-utils zstd
        shell: bash

      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run Switch 2 package verification unit tests
        run: python3 tests/test_switch2_package.py

      - name: Install Switch portlibs (with dkp-pacman retry) and ounce-devkit
        run: |
          set -euo pipefail
          sleep 20
          dkp-pacman -R --noconfirm switch-tinyxml2 || true

          sync_ok=0
          for attempt in 1 2 3 4; do
            echo "Synchronizing devkitPro package databases (attempt ${attempt}/4)..."
            if dkp-pacman -Sy --noconfirm && dkp-pacman -S --needed --noconfirm \
              switch-sdl2 switch-glad switch-curl switch-zlib switch-bzip2 switch-liblzma switch-libzstd switch-pkg-config; then
              sync_ok=1
              break
            fi
            sleep $((attempt * 15))
          done
          if [ "$sync_ok" -ne 1 ]; then
            echo "Warning: dkp-pacman sync failed; checking preinstalled packages in container..."
            test -f /opt/devkitpro/portlibs/switch/lib/libSDL2.a
            test -f /opt/devkitpro/portlibs/switch/lib/libglad.a
            test -f /opt/devkitpro/portlibs/switch/lib/libcurl.a
          fi

          mkdir -p /tmp/ounce-devkit
          cd /tmp/ounce-devkit
          BASE_URL="https://github.com/ighor/ounce-devkit/releases/download/${OUNCE_DEVKIT_TAG}"
          for pkg in \
            "libounce-26.11.15-1-any.pkg.tar.xz" \
            "ounce-tools-1.15.22-1-any.pkg.tar.xz" \
            "ounce-pkg-config-0.28-1-any.pkg.tar.xz" \
            "OunceVK-2026.11.15-1-any.pkg.tar.zst"; do
            curl -fL --retry 4 --retry-delay 5 -O "${BASE_URL}/${pkg}"
          done
          dkp-pacman -U --noconfirm \
            libounce-26.11.15-1-any.pkg.tar.xz \
            ounce-tools-1.15.22-1-any.pkg.tar.xz \
            ounce-pkg-config-0.28-1-any.pkg.tar.xz \
            OunceVK-2026.11.15-1-any.pkg.tar.zst

          git clone https://github.com/ighor/ounce-devkit.git /tmp/ounce-devkit-src
          git -C /tmp/ounce-devkit-src checkout "${OUNCE_DEVKIT_COMMIT}"
          cp -f /tmp/ounce-devkit-src/libounce/cmake/Switch2.cmake /opt/devkitpro/libounce/cmake/Switch2.cmake
          cp -f /tmp/ounce-devkit-src/libounce/cmake/Platform/Switch2.cmake /opt/devkitpro/libounce/cmake/Platform/Switch2.cmake

      - name: Build BattleShip-Remix.nro for Switch 2
        run: |
          chmod +x scripts/switch/build-switch2.sh
          ./scripts/switch/build-switch2.sh

      - name: Stage Switch 2 release artifacts
        run: |
          set -euo pipefail
          mkdir -p dist/switch/BattleShip-Remix/assets/custom/fonts
          cp build-switch2/BattleShip-Remix.nro dist/BattleShip-Remix-switch2.nro
          cp build-switch2/BattleShip-Remix.nro dist/switch/BattleShip-Remix/BattleShip-Remix.nro
          cp f3d.o2r dist/switch/BattleShip-Remix/f3d.o2r
          cp config.yml dist/switch/BattleShip-Remix/config.yml
          cp gamecontrollerdb.txt dist/switch/BattleShip-Remix/gamecontrollerdb.txt
          cp assets/custom/fonts/Montserrat-Regular.ttf dist/switch/BattleShip-Remix/assets/custom/fonts/Montserrat-Regular.ttf
          cp assets/custom/fonts/Inconsolata-Regular.ttf dist/switch/BattleShip-Remix/assets/custom/fonts/Inconsolata-Regular.ttf
          (cd dist && zip -r BattleShip-Remix-switch2.zip switch/)
          (cd dist && sha256sum BattleShip-Remix-switch2.nro BattleShip-Remix-switch2.zip > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload Switch 2 NRO & SD bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: BattleShip-Remix-switch2
          path: |
            dist/BattleShip-Remix-switch2.nro
            dist/BattleShip-Remix-switch2.zip
            dist/SHA256SUMS.txt
            build-switch2/BattleShip-Remix-switch2.map

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BattleShip-Remix-switch2.nro
            dist/BattleShip-Remix-switch2.zip
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
